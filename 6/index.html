<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border and outline</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px greenyellow;
        }
        .text-shadow{
            text-shadow: 2px 2px 4px rgb(146, 77, 77);
            outline: 2px solid black;
            border: 2px solid rgb(255, 255, 255);
            outline-offset: 10px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-shadow">Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur quo consectetur
        necessitatibus quos, exercitationem, architecto dignissimos quae nulla illum nemo eaque dolores expedita velit,
        reiciendis suscipit quaerat illo voluptates ad consequuntur laborum eos eius?</p>
</body>

</html>
